name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer les dépendances
        run: pip install -r requirements.txt pytest
      - name: Vérifier que tous les fichiers Python compilent
        run: python -m compileall -q api ingester analysis tools
      - name: Tests
        run: pytest -v

  deploy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntaxe du script de durcissement
        run: bash -n deploy/harden.sh
      - name: Validation de docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Construction de l'image Docker
        run: docker build -t honeypot-map-app .
